<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-Check</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script>
/* Diese Datei ist fuer ALLE Checks identisch und wird nie angefasst.
   Sie findet assets/ selbst - egal wie tief der Check im Repo liegt. */
(function () {
  var p = location.pathname, i = p.indexOf("/checks/");
  window.CHECK_ROOT = i >= 0 ? p.slice(0, i + 8) : "/";
  document.write('<link rel="stylesheet" href="' + window.CHECK_ROOT + 'assets/check.css">');
})();
</script>
</head>
<body>
<div class="wrap" id="check"></div>
<script>
document.write('<scr' + 'ipt src="' + window.CHECK_ROOT + 'assets/check.js"><\/scr' + 'ipt>');
</script>
</body>
</html>
